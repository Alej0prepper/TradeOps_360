name: TradeOps phase 1
on:
  push:
    branches: [main, 'sprint/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tradeops-${{ github.ref }}
  cancel-in-progress: true
env:
  ODOO_IMAGE: odoo:17.0@sha256:8779f8157ddcc37b84014c94646073f46fd4ad776b7a5d95fc3b0dc73a24a8fa
  POSTGRES_IMAGE: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
jobs:
  functional:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U odoo -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install, test, demonstrate, update and restore
        run: bash scripts/ci.sh
      - name: Archive source and diagnostics
        if: always()
        run: |
          mkdir -p .ci
          tar --exclude=.git --exclude=.ci --exclude=__pycache__ -czf .ci/source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: phase-1-evidence
          include-hidden-files: true
          path: |
            .ci/*.log
            .ci/*.txt
            .ci/source.tar.gz
            .ci/data/evidence/
          retention-days: 14
